packages:
  - demo
  - lib
  - site
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - esbuild
  - unrs-resolver
  - vue-demi
onlyBuiltDependencies:
  - '@nestjs/core'
  - better-sqlite3
  - sharp
# Security backports for Dependabot alerts in transitive dependencies. Each
# selector matches only dependents whose requested range still allows a
# vulnerable version, so a parent that already asks for a patched release is
# left alone. Remove an entry once no parent resolves a vulnerable version
# without it.
overrides:
  'handlebars@<4.7.10': ^4.7.10
  'proxy-addr@<2.0.8': ^2.0.8
  # monaco-editor pins 3.2.7 exactly
  'dompurify@<3.4.17': ^3.4.17
  'body-parser@>=2.0.0 <2.4.0': ^2.4.0
  'brace-expansion@<1.1.21': ^1.1.21
  'brace-expansion@>=4.0.0 <5.0.12': ^5.0.12
  'fast-uri@<3.1.9': ^3.1.9
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'source-map-js@<1.2.2': ^1.2.2
  'qs@>=6.7.0 <6.16.1': ^6.16.1
  # @nestjs/platform-express pins 2.4.0 exactly
  'multer@<2.5.0': ^2.5.0
  'sharp@<0.35.5': ^0.35.5
  '@modelcontextprotocol/sdk@<1.32.0': ^1.32.0
  '@modelcontextprotocol/server@<2.3.0': ^2.3.0
  '@modelcontextprotocol/client@<2.3.0': ^2.3.0
  'hono@<4.13.11': ^4.13.11
  '@hono/node-server@<2.1.3': ^2.1.3
  'ip-address@<10.7.4': ^10.7.4
