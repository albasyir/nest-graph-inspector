name: Redeploy Site from Tag or Branch

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git tag or branch to deploy
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5

      # The site imports the library as a workspace dependency.
      - name: Build library
        run: pnpm --filter nest-graph-inspector run build

      - name: Generate static site
        working-directory: site
        run: pnpm exec nuxt generate
        env:
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: /nest-graph-inspector/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
