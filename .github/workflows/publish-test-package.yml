name: Publish Test Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unique prerelease version to publish (for example, 0.0.1-test.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-test-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # lib/package.json sets publishConfig.provenance, so every publish
      # attests — flag or no flag — and npm fails outright without this.
      id-token: write
    # actions/setup-node's registry-url writes an .npmrc holding the literal
    # ${NODE_AUTH_TOKEN} and points NPM_CONFIG_USERCONFIG at it, so every later
    # pnpm step reads that file and warns when the variable is undefined. An
    # empty default satisfies the expansion. The publish step overrides it with
    # the real secret, so the live token never reaches `pnpm install` and the
    # dependency lifecycle scripts it runs.
    env:
      NODE_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set test package version
        working-directory: lib
        env:
          TEST_VERSION: ${{ inputs.version }}
        run: npm version "$TEST_VERSION" --no-git-tag-version --ignore-scripts

      - name: Build package
        run: pnpm --filter nest-graph-inspector run build

      - name: Publish test package
        working-directory: lib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --tag test
