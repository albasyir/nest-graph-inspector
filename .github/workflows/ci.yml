name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The demo imports nest-graph-inspector through its published entry
      # points, so its types have to exist on disk before anything type-aware
      # runs against the demo sources.
      - name: Build library
        run: pnpm --filter nest-graph-inspector run build

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build library and demo
        run: pnpm run build

  library-matrix:
    name: Library on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test library
        run: pnpm --filter nest-graph-inspector run test

      - name: Build library
        run: pnpm --filter nest-graph-inspector run build

  site:
    name: Site build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The library is a workspace dependency of the site, so its dist/ has to
      # exist before Nuxt resolves imports.
      - name: Build library
        run: pnpm --filter nest-graph-inspector run build

      # The site serves the demo application as a payload the browser runs, so
      # it has to be built before the site is generated.
      - name: Build demo payload
        run: pnpm --filter nest-graph-inspector-demo run build:nodepod

      # Nothing else boots the payload, and the site depends on the viewer link
      # the application prints to find its graph endpoint.
      - name: Verify demo payload boots
        run: pnpm --filter nest-graph-inspector-site run test:demo-payload

      - name: Generate static site
        working-directory: site
        run: pnpm exec nuxt generate
        env:
          NITRO_PRESET: github_pages
          NUXT_APP_BASE_URL: /nest-graph-inspector/
